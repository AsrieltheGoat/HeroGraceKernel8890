name: Kernel Build CI
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/AsrieltheGoat/HeroGraceKernel8890
          kernel-branch: dev
          config: .config
          arch: arm64
          android-version: 10
          other-gcc64-url: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
          other-gcc64-branch: lineage-19.1
          other-gcc32-url: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9
          other-gcc32-branch: lineage-19.1
          disable-lto: true
          anykernel3: false
          bootimg-url: https://github.com/AsrieltheGoat/HeroGraceKernel8890/releases/download/hero2lte/HeroGraceKernel-V1.0-G935X-20251115-ksu.img
